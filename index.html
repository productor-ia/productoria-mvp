<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProductorIA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101218;
  color: white;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 700px;
  padding: 30px 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  color: #9da3b0;
  margin-bottom: 30px;
}

.card {
  background: #191c24;
  border: 1px solid #303541;
  border-radius: 22px;
  padding: 25px;
}

.status {
  text-align: center;
  color: #9da3b0;
}

.note {
  text-align: center;
  font-size: 80px;
  font-weight: bold;
  margin: 35px 0 10px;
}

.frequency {
  text-align: center;
  color: #aeb4c0;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: white;
  color: #111;
}

.stop {
  background: #292e39;
  color: white;
}

canvas {
  width: 100%;
  height: 100px;
  margin-top: 25px;
  background: #101218;
  border-radius: 14px;
}

.info {
  margin-top: 25px;
  padding: 18px;
  background: #11141b;
  border-radius: 15px;
  color: #b8bec9;
  line-height: 1.5;
}
 .melody {
  margin-top: 20px;
  padding: 18px;
  background: #11141b;
  border-radius: 15px;
}

.melody-title {
  color: #9da3b0;
  font-size: 14px;
  margin-bottom: 10px;
}

.melody-notes {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.6;
  word-break: break-word;
} 
</style>
</head>

<body>

<div class="app">

<h1>ProductorIA</h1>

<div class="subtitle">
Tu compañero compositor
</div>

<div class="card">

<div id="status" class="status">
Micrófono detenido
</div>

<div id="note" class="note">
—
</div>

<div id="frequency" class="frequency">
Toca una nota
</div>

<canvas id="wave"></canvas>

<button id="start" class="start">
🎙 Activar micrófono
</button>

<button id="stop" class="stop" disabled>
Detener
</button>
<div class="melody">
    <div class="melody-title">
        Melodía detectada
    </div>

    <div id="melodyNotes" class="melody-notes">
        —
    </div>
</div>
<div class="info">
<b>Primera prueba</b><br><br>
ProductorIA está intentando escuchar tu instrumento
y detectar la frecuencia fundamental de la señal.
</div>

</div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let stream;
let animation;

/* =========================================
   CONFIGURACIÓN
========================================= */

const noteNames = [
    "C", "C♯", "D", "D♯", "E", "F",
    "F♯", "G", "G♯", "A", "A♯", "B"
];

const RMS_THRESHOLD = 0.008;

/*
 * Cantidad de lecturas consecutivas necesarias
 * para aceptar una nueva nota.
 */
const STABILITY_REQUIRED = 5;

/*
 * Una nota debe diferenciarse suficientemente
 * de la nota activa para ser considerada nueva.
 */
const MIN_NOTE_CHANGE_CENTS = 45;

/*
 * Tiempo mínimo durante el cual una nueva
 * frecuencia debe demostrar estabilidad.
 */
const NEW_NOTE_TIME = 90;

/*
 * Tiempo de silencio necesario para liberar
 * completamente una nota.
 */
const RELEASE_TIME = 120;

/*
 * Ventana de melodía visible.
 */
const MELODY_WINDOW = 5000;


/* =========================================
   ELEMENTOS
========================================= */

const noteElement =
    document.getElementById("note");

const frequencyElement =
    document.getElementById("frequency");

const statusElement =
    document.getElementById("status");

const melodyElement =
    document.getElementById("melodyNotes");

const canvas =
    document.getElementById("wave");

const canvasContext =
    canvas.getContext("2d");


/* =========================================
   ESTADO
========================================= */

let activeNote = null;
let activeFrequency = null;

let candidateNote = null;
let candidateFrequency = null;
let candidateCount = 0;
let candidateStarted = null;

let silenceStarted = null;

let detectedNotes = [];
let lastRecordedTime = 0;


/* =========================================
   UTILIDADES MUSICALES
========================================= */

/*
 * Convierte frecuencia a MIDI.
 */
function frequencyToMidi(frequency) {

    return (
        69 +
        12 *
        Math.log2(
            frequency / 440
        )
    );
}


/*
 * Convierte frecuencia a nota.
 */
function frequencyToNote(frequency) {
  if (!frequency || frequency <= 0) {
    return null;
  }

  const midi = Math.round(
    69 + 12 * Math.log2(frequency / 440)
  );

  const noteNames = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
  ];

  const note = noteNames[(midi % 12 + 12) % 12];

  return note;
}


/*
 * Distancia entre dos frecuencias
 * expresada en cents.
 */
function centsDifference(
    frequency1,
    frequency2
) {

    if (
        !frequency1 ||
        !frequency2
    ) {

        return Infinity;
    }

    return Math.abs(
        1200 *
        Math.log2(
            frequency1 /
            frequency2
        )
    );
}


/* =========================================
   DETECTOR DE PITCH
========================================= */

function detectPitch(
    buffer,
    sampleRate
) {

    let rms = 0;

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];
    }

    rms =
        Math.sqrt(
            rms /
            buffer.length
        );


    if (
        rms < RMS_THRESHOLD
    ) {

        return null;
    }


    /*
     * Rango general de guitarra.
     *
     * E2 ≈ 82 Hz
     * E4 ≈ 330 Hz
     */

    const minFrequency = 75;
    const maxFrequency = 380;


    const minLag =
        Math.floor(
            sampleRate /
            maxFrequency
        );

    const maxLag =
        Math.floor(
            sampleRate /
            minFrequency
        );


    let candidates = [];


    /*
     * Autocorrelación normalizada.
     */

    for (
        let lag = minLag;
        lag <= maxLag;
        lag++
    ) {

        let sum = 0;
        let energy1 = 0;
        let energy2 = 0;


        for (
            let i = 0;
            i < buffer.length - lag;
            i++
        ) {

            const a =
                buffer[i];

            const b =
                buffer[i + lag];


            sum +=
                a * b;

            energy1 +=
                a * a;

            energy2 +=
                b * b;
        }


        if (
            energy1 === 0 ||
            energy2 === 0
        ) {

            continue;
        }


        const score =
            sum /
            Math.sqrt(
                energy1 *
                energy2
            );


        if (
            score > 0.20
        ) {

            candidates.push({

                frequency:
                    sampleRate /
                    lag,

                score:
                    score
            });
        }
    }


    if (
        candidates.length === 0
    ) {

        return null;
    }


    candidates.sort(
        (a, b) =>
            b.score -
            a.score
    );


    /*
     * =====================================
     * SELECCIÓN DE FUNDAMENTAL
     * =====================================
     *
     * En vez de aceptar ciegamente
     * el candidato con mayor score,
     * buscamos también posibles
     * subarmónicos.
     */

    let selected =
  candidates[0];

/*
 * ============================================================
 * SELECCIÓN DEL FUNDAMENTAL
 * ============================================================
 *
 * La autocorrelación puede detectar una frecuencia inferior
 * al fundamental real:
 *
 *   fundamental real → 246 Hz
 *   detección errónea → 123 Hz
 *
 * En ese caso debemos buscar el DOBLE de la frecuencia
 * detectada, no la mitad.
 *
 * También comprobamos el TRIPLE para casos como:
 *
 *   fundamental real → 220 Hz
 *   detección errónea → 73 Hz
 *
 * No modificamos automáticamente la frecuencia.
 * Solo corregimos si existe otro candidato suficientemente
 * cercano y con un score razonablemente fuerte.
 */

/*
 * Buscar candidato aproximadamente al doble.
 */
const doubleFrequency =
  selected.frequency * 2;

for (const candidate of candidates) {

  const difference =
    Math.abs(
      candidate.frequency -
      doubleFrequency
    );

  if (
    difference <= 3 &&
    candidate.score >=
      selected.score * 0.50
  ) {
    selected = candidate;
    break;
  }
}

/*
 * Buscar candidato aproximadamente al triple.
 *
 * Esto permite recuperar el fundamental cuando la
 * autocorrelación se ha enganchado en aproximadamente
 * 1/3 de la frecuencia real.
 */
const tripleFrequency =
  selected.frequency * 3;

for (const candidate of candidates) {

  const difference =
    Math.abs(
      candidate.frequency -
      tripleFrequency
    );

  if (
    difference <= 3 &&
    candidate.score >=
      selected.score * 0.50
  ) {
    selected = candidate;
    break;
  }
}

return {
  frequency:
    selected.frequency,

  score:
    selected.score
};

/* =========================================
   ONDA
========================================= */

function drawWaveform(buffer) {

    canvasContext.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvasContext.beginPath();


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        const x =
            i /
            buffer.length *
            canvas.width;


        const y =
            (1 - buffer[i]) *
            canvas.height /
            2;


        if (
            i === 0
        ) {

            canvasContext.moveTo(
                x,
                y
            );

        } else {

            canvasContext.lineTo(
                x,
                y
            );
        }
    }


    canvasContext.stroke();
}


/* =========================================
   REGISTRAR NOTA
========================================= */

function recordNote(
    note,
    frequency,
    now
) {

    /*
     * No registrar dos eventos
     * prácticamente simultáneos.
     */

    if (
        now -
        lastRecordedTime <
        100
    ) {

        return;
    }


    detectedNotes.push({

        note:
            note,

        frequency:
            frequency,

        time:
            now
    });


    lastRecordedTime =
        now;


    /*
     * Mantener solamente
     * los últimos 5 segundos.
     */

    detectedNotes =
        detectedNotes.filter(
            item =>
                now -
                item.time <
                MELODY_WINDOW
        );


    updateMelody();
}


/* =========================================
   MOSTRAR MELODÍA
========================================= */

function updateMelody() {

    if (
        detectedNotes.length === 0
    ) {

        melodyElement.textContent =
            "—";

        return;
    }


    melodyElement.textContent =
        detectedNotes
            .map(
                item =>
                    item.note
            )
            .join(
                " → "
            );
}


/* =========================================
   ACEPTAR NUEVA NOTA
========================================= */

function acceptNewNote(
    note,
    frequency,
    now
) {

    activeNote =
        note;

    activeFrequency =
        frequency;


    noteElement.textContent =
        note;


    frequencyElement.textContent =
        frequency.toFixed(1) +
        " Hz";


    recordNote(
        note,
        frequency,
        now
    );


    candidateNote =
        null;

    candidateFrequency =
        null;

    candidateCount =
        0;

    candidateStarted =
        null;
}


/* =========================================
   PROCESAMIENTO DE AUDIO
========================================= */

function processAudio() {

    const buffer =
        new Float32Array(
            analyser.fftSize
        );


    analyser.getFloatTimeDomainData(
        buffer
    );


    drawWaveform(buffer);


    const result =
        detectPitch(
            buffer,
            audioContext.sampleRate
        );


    const now =
        Date.now();


    /* =====================================
       SIN SEÑAL
    ===================================== */

    if (
        result === null
    ) {

        /*
         * Si existe una nota activa,
         * iniciamos contador de silencio.
         */

        if (
            activeNote !== null &&
            silenceStarted === null
        ) {

            silenceStarted =
                now;
        }


        /*
         * Después de suficiente silencio,
         * liberamos la nota.
         */

        if (
            activeNote !== null &&
            silenceStarted !== null &&
            now -
            silenceStarted >=
            RELEASE_TIME
        ) {

            activeNote =
                null;

            activeFrequency =
                null;

            candidateNote =
                null;

            candidateFrequency =
                null;

            candidateCount =
                0;

            candidateStarted =
                null;

            silenceStarted =
                null;
        }


        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* =====================================
       TENEMOS SEÑAL
    ===================================== */

    silenceStarted =
        null;


    const frequency =
        result.frequency;

    const note =
        frequencyToNote(
            frequency
        );


    /* =====================================
       NO EXISTE NOTA ACTIVA
    ===================================== */

    if (
        activeNote === null
    ) {

        if (
            candidateNote === note
        ) {

            candidateCount++;

        } else {

            candidateNote =
                note;

            candidateFrequency =
                frequency;

            candidateCount =
                1;

            candidateStarted =
                now;
        }


        if (
            candidateCount >=
            STABILITY_REQUIRED &&
            now -
            candidateStarted >=
            NEW_NOTE_TIME
        ) {

            acceptNewNote(
                note,
                frequency,
                now
            );
        }


        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* =====================================
       MISMA NOTA
    ===================================== */

    if (
        note === activeNote
    ) {

        /*
         * Actualizamos la frecuencia
         * visual, pero NO creamos
         * otro evento.
         */

        activeFrequency =
            frequency;


        noteElement.textContent =
            activeNote;


        frequencyElement.textContent =
            frequency.toFixed(1) +
            " Hz";


        candidateNote =
            null;

        candidateFrequency =
            null;

        candidateCount =
            0;

        candidateStarted =
            null;


        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* =====================================
       POSIBLE NUEVA NOTA
    ===================================== */

    const change =
        centsDifference(
            frequency,
            activeFrequency
        );


    /*
     * Si la diferencia es pequeña,
     * probablemente es simplemente
     * vibración / afinación / ruido.
     */

    if (
        change <
        MIN_NOTE_CHANGE_CENTS
    ) {

        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* =====================================
       CANDIDATA A NUEVA NOTA
    ===================================== */

    if (
        candidateNote === note
    ) {

        candidateCount++;


        /*
         * Suavizado de frecuencia.
         */

        candidateFrequency =
            (
                candidateFrequency +
                frequency
            ) / 2;

    } else {

        candidateNote =
            note;

        candidateFrequency =
            frequency;

        candidateCount =
            1;

        candidateStarted =
            now;
    }


    /* =====================================
       CONFIRMAR CAMBIO
    ===================================== */

    if (
        candidateCount >=
        STABILITY_REQUIRED &&
        now -
        candidateStarted >=
        NEW_NOTE_TIME
    ) {

        /*
         * Antes de aceptar la nueva nota,
         * comprobamos nuevamente que
         * realmente sea distinta.
         */

        const finalDifference =
            centsDifference(
                candidateFrequency,
                activeFrequency
            );


        if (
            finalDifference >=
            MIN_NOTE_CHANGE_CENTS
        ) {

            acceptNewNote(
                candidateNote,
                candidateFrequency,
                now
            );
        }
    }


    animation =
        requestAnimationFrame(
            processAudio
        );
}


/* =========================================
   ACTIVAR MICRÓFONO
========================================= */

document
.getElementById("start")
.addEventListener(
    "click",
    async () => {

        try {

            stream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation:
                            false,

                        noiseSuppression:
                            false,

                        autoGainControl:
                            false
                    }
                });


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            microphone =
                audioContext
                .createMediaStreamSource(
                    stream
                );


            analyser =
                audioContext
                .createAnalyser();


            analyser.fftSize =
                4096;


            microphone.connect(
                analyser
            );


            /*
             * Reiniciar estado.
             */

            activeNote =
                null;

            activeFrequency =
                null;

            candidateNote =
                null;

            candidateFrequency =
                null;

            candidateCount =
                0;

            candidateStarted =
                null;

            silenceStarted =
                null;

            detectedNotes =
                [];

            lastRecordedTime =
                0;


            melodyElement.textContent =
                "—";


            statusElement.textContent =
                "🎙 Escuchando en tiempo real";


            document
            .getElementById("start")
            .disabled =
                true;


            document
            .getElementById("stop")
            .disabled =
                false;


            processAudio();


        } catch (error) {

            statusElement.textContent =
                "No se pudo acceder al micrófono";

            console.error(
                error
            );
        }
    }
);


/* =========================================
   DETENER
========================================= */

document
.getElementById("stop")
.addEventListener(
    "click",
    () => {

        cancelAnimationFrame(
            animation
        );


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        if (audioContext) {

            audioContext.close();
        }


        activeNote =
            null;

        activeFrequency =
            null;

        candidateNote =
            null;

        candidateFrequency =
            null;

        candidateCount =
            0;

        candidateStarted =
            null;

        silenceStarted =
            null;


        statusElement.textContent =
            "Micrófono detenido";


        document
        .getElementById("start")
        .disabled =
            false;


        document
        .getElementById("stop")
        .disabled =
            true;
    }
);

</script>

</body>
</html>
