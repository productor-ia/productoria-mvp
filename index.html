<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProductorIA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101218;
  color: white;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 700px;
  padding: 30px 20px;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}
.subtitle {
  text-align: center;
  color: #9da3b0;
  margin-bottom: 30px;
}

.card {
  background: #191c24;
  border: 1px solid #303541;
  border-radius: 22px;
  padding: 25px;
}

.status {
  text-align: center;
  color: #9da3b0;
}

.note {
  text-align: center;
  font-size: 80px;
  font-weight: bold;
  margin: 35px 0 10px;
}

.frequency {
  text-align: center;
  color: #aeb4c0;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start {
  background: white;
  color: #111;
}

.stop {
  background: #292e39;
  color: white;
}

canvas {
  width: 100%;
  height: 100px;
  margin-top: 25px;
  background: #101218;
  border-radius: 14px;
}

.info {
  margin-top: 25px;
  padding: 18px;
  background: #11141b;
  border-radius: 15px;
  color: #b8bec9;
  line-height: 1.5;
}
 .melody {
  margin-top: 20px;
  padding: 18px;
  background: #11141b;
  border-radius: 15px;
}

.melody-title {
  color: #9da3b0;
  font-size: 14px;
  margin-bottom: 10px;
}

.melody-notes {
  font-size: 22px;
  font-weight: bold;
  line-height: 1.6;
  word-break: break-word;
} 
</style>
</head>

<body>

<div class="app">

<h1>ProductorIA</h1>

<div class="subtitle">
Tu compañero compositor
</div>

<div class="card">

<div id="status" class="status">
Micrófono detenido
</div>

<div id="note" class="note">
—
</div>

<div id="frequency" class="frequency">
Toca una nota
</div>

<canvas id="wave"></canvas>

<button id="start" class="start">
🎙 Activar micrófono
</button>

<button id="stop" class="stop" disabled>
Detener
</button>
<div class="melody">
    <div class="melody-title">
        Melodía detectada
    </div>

    <div id="melodyNotes" class="melody-notes">
        —
    </div>
</div>
<div class="info">
<b>Primera prueba</b><br><br>
ProductorIA está intentando escuchar tu instrumento
y detectar la frecuencia fundamental de la señal.
</div>

</div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let stream;
let animation;

/* ================================
   CONFIGURACIÓN
================================ */

const noteNames = [
    "C", "C♯", "D", "D♯", "E", "F",
    "F♯", "G", "G♯", "A", "A♯", "B"
];

const RMS_THRESHOLD = 0.008;

/*
 * Cuántas lecturas consecutivas necesita
 * una nota para ser confirmada.
 */
const STABILITY_REQUIRED = 3;

/*
 * Tiempo de silencio necesario para considerar
 * que una nota terminó.
 */
const RELEASE_TIME = 90;

/*
 * Tiempo mínimo entre dos registros.
 */
const RETRIGGER_TIME = 80;

/*
 * Conservamos los últimos 5 segundos.
 */
const MELODY_WINDOW = 5000;


/* ================================
   ELEMENTOS HTML
================================ */

const noteElement =
    document.getElementById("note");

const frequencyElement =
    document.getElementById("frequency");

const statusElement =
    document.getElementById("status");

const melodyElement =
    document.getElementById("melodyNotes");

const canvas =
    document.getElementById("wave");

const canvasContext =
    canvas.getContext("2d");


/* ================================
   ESTADO DEL DETECTOR
================================ */

let candidateNote = null;
let candidateCount = 0;

let activeNote = null;
let activeFrequency = null;

let silenceStarted = null;
let lastRecordedTime = 0;

let detectedNotes = [];


/* ================================
   FRECUENCIA → NOTA
================================ */

function frequencyToNote(frequency) {

    const midi =
        Math.round(
            69 +
            12 *
            Math.log2(frequency / 440)
        );

    return noteNames[
        (midi % 12 + 12) % 12
    ];
}


/* ================================
   DETECTOR DE PITCH
================================ */

function detectPitch(buffer, sampleRate) {

    let rms = 0;

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        rms +=
            buffer[i] *
            buffer[i];
    }

    rms =
        Math.sqrt(
            rms / buffer.length
        );

    if (rms < RMS_THRESHOLD) {
        return null;
    }


    const minFrequency = 75;
    const maxFrequency = 380;

    const minLag =
        Math.floor(
            sampleRate / maxFrequency
        );

    const maxLag =
        Math.floor(
            sampleRate / minFrequency
        );


    let candidates = [];


    for (
        let lag = minLag;
        lag <= maxLag;
        lag++
    ) {

        let sum = 0;
        let energy1 = 0;
        let energy2 = 0;


        for (
            let i = 0;
            i < buffer.length - lag;
            i++
        ) {

            const a = buffer[i];
            const b = buffer[i + lag];

            sum += a * b;

            energy1 +=
                a * a;

            energy2 +=
                b * b;
        }


        if (
            energy1 === 0 ||
            energy2 === 0
        ) {
            continue;
        }


        const score =
            sum /
            Math.sqrt(
                energy1 *
                energy2
            );


        if (score > 0.20) {

            candidates.push({
                frequency:
                    sampleRate / lag,

                score:
                    score
            });
        }
    }


    if (
        candidates.length === 0
    ) {

        return null;
    }


    candidates.sort(
        (a, b) =>
            b.score - a.score
    );


    let selected =
        candidates[0];


    /*
     * Corrección específica de armónicos.
     *
     * Si detectamos aproximadamente E3
     * (164.8 Hz), buscamos E2
     * (82.4 Hz).
     */

    if (
        selected.frequency >= 150 &&
        selected.frequency <= 180
    ) {

        const fundamental =
            selected.frequency / 2;

        let fundamentalCandidate =
            null;


        for (
            const candidate
            of candidates
        ) {

            const difference =
                Math.abs(
                    candidate.frequency -
                    fundamental
                );


            if (
                difference <= 2 &&
                (
                    fundamentalCandidate === null ||
                    candidate.score >
                    fundamentalCandidate.score
                )
            ) {

                fundamentalCandidate =
                    candidate;
            }
        }


        if (
            fundamentalCandidate &&
            fundamentalCandidate.score >=
            selected.score * 0.65
        ) {

            selected =
                fundamentalCandidate;
        }
    }


    return selected.frequency;
}


/* ================================
   ONDA
================================ */

function drawWaveform(buffer) {

    canvasContext.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvasContext.beginPath();

    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        const x =
            i /
            buffer.length *
            canvas.width;


        const y =
            (1 - buffer[i]) *
            canvas.height /
            2;


        if (i === 0) {

            canvasContext.moveTo(
                x,
                y
            );

        } else {

            canvasContext.lineTo(
                x,
                y
            );
        }
    }

    canvasContext.stroke();
}


/* ================================
   REGISTRAR NOTA
================================ */

function recordNote(
    note,
    frequency,
    now
) {

    /*
     * Evitamos registros demasiado juntos.
     */

    if (
        now - lastRecordedTime <
        RETRIGGER_TIME
    ) {

        return;
    }


    detectedNotes.push({

        note:
            note,

        frequency:
            frequency,

        time:
            now
    });


    lastRecordedTime =
        now;


    /*
     * Eliminamos notas antiguas.
     */

    detectedNotes =
        detectedNotes.filter(
            item =>
                now - item.time <
                MELODY_WINDOW
        );


    /*
     * Mostramos la melodía.
     */

    if (
        detectedNotes.length > 0
    ) {

        melodyElement.textContent =
            detectedNotes
                .map(
                    item =>
                        item.note
                )
                .join(" → ");

    } else {

        melodyElement.textContent =
            "—";
    }
}


/* ================================
   PROCESAMIENTO PRINCIPAL
================================ */

function processAudio() {

    const buffer =
        new Float32Array(
            analyser.fftSize
        );


    analyser.getFloatTimeDomainData(
        buffer
    );


    drawWaveform(buffer);


    const frequency =
        detectPitch(
            buffer,
            audioContext.sampleRate
        );


    const now =
        Date.now();


    /* ============================
       NO HAY SEÑAL
    ============================ */

    if (!frequency) {

        /*
         * Si había una nota activa,
         * comenzamos a medir silencio.
         */

        if (
            activeNote !== null &&
            silenceStarted === null
        ) {

            silenceStarted =
                now;
        }


        /*
         * Si el silencio dura suficiente,
         * liberamos la nota.
         */

        if (
            activeNote !== null &&
            silenceStarted !== null &&
            now - silenceStarted >=
            RELEASE_TIME
        ) {

            activeNote =
                null;

            activeFrequency =
                null;

            candidateNote =
                null;

            candidateCount =
                0;

            silenceStarted =
                null;
        }


        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* ============================
       HAY SEÑAL
    ============================ */

    silenceStarted =
        null;


    const note =
        frequencyToNote(
            frequency
        );


    /* ============================
       TODAVÍA ESTAMOS EN LA MISMA
       NOTA
    ============================ */

    if (
        activeNote === note
    ) {

        activeFrequency =
            frequency;


        noteElement.textContent =
            activeNote;


        frequencyElement.textContent =
            frequency.toFixed(1) +
            " Hz";


        animation =
            requestAnimationFrame(
                processAudio
            );

        return;
    }


    /* ============================
       NUEVA NOTA CANDIDATA
    ============================ */

    if (
        candidateNote === note
    ) {

        candidateCount++;

    } else {

        candidateNote =
            note;

        candidateCount =
            1;
    }


    /* ============================
       CONFIRMAR NUEVA NOTA
    ============================ */

    if (
        candidateCount >=
        STABILITY_REQUIRED
    ) {

        /*
         * La nueva nota queda activa.
         */

        activeNote =
            note;

        activeFrequency =
            frequency;


        noteElement.textContent =
            note;


        frequencyElement.textContent =
            frequency.toFixed(1) +
            " Hz";


        /*
         * La registramos solamente
         * una vez.
         */

        recordNote(
            note,
            frequency,
            now
        );


        /*
         * Reiniciamos candidato.
         */

        candidateNote =
            null;

        candidateCount =
            0;
    }


    animation =
        requestAnimationFrame(
            processAudio
        );
}


/* ================================
   ACTIVAR MICRÓFONO
================================ */

document
.getElementById("start")
.addEventListener(
    "click",
    async () => {

        try {

            stream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation:
                            false,

                        noiseSuppression:
                            false,

                        autoGainControl:
                            false
                    }
                });


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            microphone =
                audioContext
                .createMediaStreamSource(
                    stream
                );


            analyser =
                audioContext
                .createAnalyser();


            analyser.fftSize =
                4096;


            microphone.connect(
                analyser
            );


            /*
             * Reiniciamos el estado
             * de la interpretación.
             */

            candidateNote =
                null;

            candidateCount =
                0;

            activeNote =
                null;

            activeFrequency =
                null;

            silenceStarted =
                null;

            detectedNotes =
                [];

            lastRecordedTime =
                0;


            melodyElement.textContent =
                "—";


            statusElement.textContent =
                "🎙 Escuchando en tiempo real";


            document
            .getElementById("start")
            .disabled =
                true;


            document
            .getElementById("stop")
            .disabled =
                false;


            processAudio();


        } catch (error) {

            statusElement.textContent =
                "No se pudo acceder al micrófono";

            console.error(
                error
            );
        }
    }
);


/* ================================
   DETENER
================================ */

document
.getElementById("stop")
.addEventListener(
    "click",
    () => {

        cancelAnimationFrame(
            animation
        );


        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        if (audioContext) {

            audioContext.close();
        }


        activeNote =
            null;

        candidateNote =
            null;

        candidateCount =
            0;

        silenceStarted =
            null;


        statusElement.textContent =
            "Micrófono detenido";


        document
        .getElementById("start")
        .disabled =
            false;


        document
        .getElementById("stop")
        .disabled =
            true;
    }
);

</script>

</body>
</html>
